<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bidding WebSocket Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 2rem;
      }
      input,
      button {
        padding: 0.5rem;
        margin: 0.25rem;
      }
      li {
        margin: 0.5rem 0;
      }
    </style>
  </head>
  <body>
    <h1>Live Auction Events</h1>

    <div>
      <input id="bidderId" placeholder="Bidder ID" value="user-012" />
      <input id="amount" type="number" placeholder="Amount" value="1700" />
      <button id="placeBid">Place Bid</button>
    </div>

    <ul id="messages"></ul>

    <script>
      const auctionId = '11111111-1111-1111-1111-111111111111';
      const socket = new WebSocket('ws://localhost:8080/ws/auctions');
      const messages = document.getElementById('messages');
      const bidderIdInput = document.getElementById('bidderId');
      const amountInput = document.getElementById('amount');
      const placeBidButton = document.getElementById('placeBid');

      socket.onopen = () => {
        console.log('WebSocket connected');
        addMessage('Connected');
      };

      socket.onmessage = (event) => {
        console.log('Received:', event.data);
        addMessage(event.data);
      };

      socket.onerror = (error) => {
        console.error('WebSocket error', error);
        addMessage('WebSocket error');
      };

      socket.onclose = () => {
        console.log('WebSocket closed');
        addMessage('WebSocket closed');
      };

      placeBidButton.addEventListener('click', () => {
        const message = {
          type: 'PLACE_BID',
          auctionId: auctionId,
          bidderId: bidderIdInput.value,
          amount: Number(amountInput.value),
        };

        socket.send(JSON.stringify(message));
        console.log('Sent:', message);
      });

      function addMessage(text) {
        const item = document.createElement('li');
        item.textContent = text;
        messages.appendChild(item);
      }
    </script>
  </body>
</html>
